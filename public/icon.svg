<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner border ring -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#34d399" stroke-width="6" stroke-opacity="0.25" />

  <!-- Soil / Growth Ground Arc -->
  <path d="M 96 380 Q 256 340 416 380 L 416 410 Q 256 370 96 410 Z" fill="#92400e" opacity="0.6" />
  <path d="M 120 395 Q 256 365 392 395" stroke="#fbbf24" stroke-width="4" stroke-dasharray="8 8" opacity="0.5" />

  <!-- Golden Investment Coin -->
  <g filter="url(#shadow)">
    <circle cx="256" cy="270" r="110" fill="url(#goldGrad)" stroke="#fef3c7" stroke-width="6" />
    <!-- Inner coin groove -->
    <circle cx="256" cy="270" r="92" fill="none" stroke="#78350f" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="6 4" />
    <!-- Dollar / Real Brazilian Currency Sign -->
    <text x="256" y="295" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="900" fill="#78350f" text-anchor="middle" opacity="0.85">R$</text>
  </g>

  <!-- Sprout Leaves Growing from the Coin -->
  <g filter="url(#shadow)">
    <!-- Main stem -->
    <path d="M 256 220 Q 256 150 256 120" stroke="#059669" stroke-width="14" stroke-linecap="round" fill="none" />

    <!-- Left Leaf -->
    <path d="M 256 170 C 210 160 170 120 180 80 C 220 80 250 125 256 170 Z" fill="url(#leafGrad)" stroke="#047857" stroke-width="4" />

    <!-- Right Leaf -->
    <path d="M 256 150 C 300 135 340 95 330 60 C 290 60 262 105 256 150 Z" fill="url(#leafGrad)" stroke="#047857" stroke-width="4" />

    <!-- Small emerging top shoot -->
    <path d="M 256 120 C 250 95 256 70 256 60 C 262 70 268 95 256 120 Z" fill="#a7f3d0" />
  </g>

  <!-- Little Growth Stars / Financial Sparkles -->
  <g fill="#fde047">
    <path d="M 370 140 Q 380 150 390 150 Q 380 150 370 160 Q 380 150 370 140 Z" />
    <circle cx="380" cy="150" r="5" />
    <circle cx="130" cy="200" r="4" fill="#a7f3d0" />
    <circle cx="395" cy="230" r="3" fill="#fde047" />
  </g>
</svg>
